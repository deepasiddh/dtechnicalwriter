<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photos</title>
    <style>
        body {
            background-color: #FFF0E5; /* Pale Peach */
            color: #000000;            /* Black text */
            font-family: Verdana, sans-serif;
            font-size: 14px;           /* 10pt size */
            line-height: 1.6;
            margin: 40px;
        }
        a {
            color: #000000;
            text-decoration: underline;
        }
        /* Photo Grid Styling */
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        .gallery-item {
            background-color: rgba(255, 255, 255, 0.4);
            padding: 10px;
            border-radius: 4px;
            text-align: center;
        }
        .gallery-item img {
            max-width: 100%;
            height: auto;
            border-radius: 2px;
        }
        .caption {
            margin-top: 8px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <header>
        <nav>
            <a href="index.html">Home</a> | 
            <a href="about.html">About Me</a> | 
            <a href="travelogue.html">Travelogue</a> | 
            <a href="photos.html">Photos</a>
        </nav>
    </header>

    <main>
        <h1>📸 Photo Gallery</h1>
        <p>A collection of snapshots from my travels, hobbies, and daily life.</p>

        <div class="gallery">
            <!-- Photo 1 -->
            <div class="gallery-item">
                <!-- Replace 'travel1.jpg' with your uploaded file name -->
                <img src="travel1.jpg" alt="Description of photo 1">
                <p class="caption">Sunset over the mountains</p>
            </div>

            <!-- Photo 2 -->
            <div class="gallery-item">
                <!-- Replace 'travel2.jpg' with your uploaded file name -->
                <img src="travel2.jpg" alt="Description of photo 2">
                <p class="caption">Strolling through the old town</p>
            </div>

            <!-- Photo 3 -->
            <div class="gallery-item">
                <!-- Replace 'travel3.jpg' with your uploaded file name -->
                <img src="travel3.jpg" alt="Description of photo 3">
                <p class="caption">A delicious local dish</p>
            </div>
        </div>
    </main>

    <footer>
        <p>© 2026 [Your Name]</p>
    </footer>
</body>
</html>
